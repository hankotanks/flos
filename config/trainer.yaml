## standard
# use as the initial seed for everything
seed: 42
max_epochs: 1199
checkpoint_metric_key: val/Mean_IOU
# runs n val batches, set to -1 to run all batches
num_sanity_val_steps: 2
# -1 for all gpus available
# devices: -1
devices: 1
accelerator: gpu
# "16-mixed", 16 or 32
# precision: 16-mixed
precision: 32
log_every_n_steps: 1
# not needed with mixed precision
gradient_clip_val: 0.5
# simulate a batch size
accumulate_grad_batches: 16
deterministic: false
# validate after n epochs
check_val_every_n_epoch: 10
# track_grad_norm: 2
#
## debug, will only be used if the debug flag is set on the cli run
debug:
  # run n batches
  # fast_dev_run: 2
  # overfit on n training (and validation) batches
  # keep in mind, this doesn't affect batch_size itself
  overfit_batches: 1
  max_epochs: 1000
  check_val_every_n_epoch: 1
  # profiler: simple
