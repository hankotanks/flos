[build-system]
requires = ["scikit-build-core"]
build-backend = "scikit_build_core.build"

[project]
name = "forest_segmentor"
version = "0.0.1"
description = "utility package for the segmentation node"
authors = [
    { name = "Meher Malladi", email = "meher.malladi@uni-bonn.de" },
    { name = "Henry Lewis", email = "hlewis@uni-bonn.de" }
]
requires-python = ">=3.8"
dependencies = ["numpy", "ipdb", "lightning<=2.3"]

[tool.scikit-build]
wheel.packages = ["forest_segmentor"]
build-dir = "build/{wheel_tag}"
wheel.cmake = false
editable.mode = "redirect"
editable.rebuild = true
editable.verbose = true
